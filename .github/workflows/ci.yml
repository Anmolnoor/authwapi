name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm test

  # The image's data-folder, rootless podman and kill-during-write checks. Check 3 (SELinux) needs an enforcing
  # host, which GitHub's Ubuntu runners aren't; it runs on Fedora before a release instead.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # upgrade-check builds the image from before the newest migration
      - run: scripts/container-check.sh 1 2 4 5
      - run: scripts/upgrade-check.sh
      - run: scripts/app-check.sh
